<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Juegos de Motricidad</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/games.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>Juegos para Motricidad</h1>
            <p>Selecciona un juego para comenzar:</p>
            <a href="index.html" class="back-btn">Volver al inicio</a>
        </header>
        
        <div class="games-container">
            <div class="game-card" id="path-game">
                <h3>Seguir el Camino</h3>
                <p>Mueve el cursor para seguir la línea sin salirte.</p>
                <button class="play-btn">Jugar</button>
            </div>
            
            <div class="game-card" id="button-game">
                <h3>Apretar Botones</h3>
                <p>Presiona los botones que aparecen en la pantalla.</p>
                <button class="play-btn">Jugar</button>
            </div>
            
            <div class="game-card" id="puzzle-game">
                <h3>Rompecabezas</h3>
                <p>Arrastra las piezas para completar la imagen.</p>
                <button class="play-btn">Jugar</button>
            </div>
        </div>
    </div>

    <script src="js/games.js"></script>
</body>
</html>
