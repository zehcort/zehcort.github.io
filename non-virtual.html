<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ejercicios de Motricidad No Virtual</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/exercises.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>Ejercicios de Motricidad</h1>
            <p class="subtitle">Instrucciones paso a paso para mejorar tu motricidad</p>
            <a href="index.html" class="back-btn">← Volver al inicio</a>
        </header>
        
        <div class="categories">
            <button class="category-btn active" data-category="fine">
                🖐️ Motricidad Fina
            </button>
            <button class="category-btn" data-category="gross">
                💪 Motricidad Gruesa
            </button>
        </div>
        
        <div class="difficulty-filter">
            <label for="difficulty">Filtrar por dificultad:</label>
            <select id="difficulty">
                <option value="all">Todas</option>
                <option value="easy">Baja</option>
                <option value="medium">Media</option>
                <option value="hard">Alta</option>
            </select>
        </div>
        
        <div id="exercises-container" class="exercises-container">
            <!-- Ejercicios se cargan aquí dinámicamente -->
        </div>
    </div>

    <script src="js/exercises.js"></script>
</body>
</html>
