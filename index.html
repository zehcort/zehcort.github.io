<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ejercicios de Motricidad</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>Bienvenido a Motricidad Activa</h1>
            <p>Selecciona tu modo de ejercicio:</p>
        </header>
        
        <div class="options">
            <button id="virtual-btn" class="option-btn">
                <div class="icon">🎮</div>
                <span>Modo Virtual (Juegos)</span>
            </button>
            
            <button id="non-virtual-btn" class="option-btn">
                <div class="icon">💪</div>
                <span>Modo No Virtual (Ejercicios)</span>
            </button>
        </div>
    </div>

    <script src="js/main.js"></script>
</body>
</html>
